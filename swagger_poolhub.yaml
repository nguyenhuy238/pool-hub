          example: 135000.0
        discountAmount:
          type: number
          example: 15000.0
        taxAmount:
          type: number
          example: 30000.0
        totalPayable:
          type: number
          example: 330000.0
        paymentStatus:
          type: string
          example: Paid

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validate dữ liệu thất bại.
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: email
              message:
                type: string
                example: Định dạng email không chính xác.
