
<style>
#erd-wrap { padding: 0.5rem 0; }
#erd svg { width: 100% !important; height: auto !important; }
</style>
<div id="erd-wrap"><div id="erd"></div></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '12px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#1a1a2e' : '#E6F1FB',
    primaryBorderColor: dark ? '#378ADD' : '#185FA5',
    primaryTextColor: dark ? '#B5D4F4' : '#0C447C',
    secondaryColor: dark ? '#0d2233' : '#E1F5EE',
    tertiaryColor: dark ? '#1a1205' : '#FAEEDA',
  },
});
const diagram = `erDiagram
  USERS {
    uuid id PK
    string email
    string password_hash
    string full_name
    string phone
    string role
    boolean is_active
    timestamp created_at
  }

  ZONES {
    uuid id PK
    string name
    string type
    string description
    boolean is_active
  }

  TABLES {
    uuid id PK
    uuid zone_id FK
    int table_number
    string table_type
    string status
    boolean is_active
  }

  PRICING_RULES {
    uuid id PK
    string table_type
    string day_type
    time slot_start
    time slot_end
    decimal price_per_hour
    decimal surcharge_pct
  }

  SESSIONS {
    uuid id PK
    uuid table_id FK
    uuid staff_id FK
    timestamp start_time
    timestamp end_time
    string status
    decimal total_amount
    string note
  }

  BOOKINGS {
    uuid id PK
    uuid customer_id FK
    uuid table_id FK
    timestamp scheduled_time
    int duration_minutes
    string status
    decimal deposit
    string note
  }

  PRODUCTS {
    uuid id PK
    string name
    string category
    decimal price
    int stock_qty
    int min_stock
    string image_url
    boolean is_available
  }

  ORDERS {
    uuid id PK
    uuid session_id FK
    uuid staff_id FK
    string status
    decimal total_amount
    timestamp created_at
  }

  ORDER_ITEMS {
    uuid id PK
    uuid order_id FK
    uuid product_id FK
    int quantity
    decimal unit_price
    decimal subtotal
  }

  INVOICES {
    uuid id PK
    uuid session_id FK
    decimal subtotal_table
    decimal subtotal_bar
    decimal discount_amount
    decimal total
    string payment_method
    string payment_status
    timestamp paid_at
  }

  SHIFTS {
    uuid id PK
    uuid staff_id FK
    date shift_date
    string shift_type
    timestamp check_in
    timestamp check_out
    decimal revenue_handled
  }

  NOTIFICATIONS {
    uuid id PK
    uuid user_id FK
    string type
    string message
    boolean is_read
    timestamp created_at
  }

  USERS ||--o{ SESSIONS : "phụ trách"
  USERS ||--o{ BOOKINGS : "đặt lịch"
  USERS ||--o{ ORDERS : "tạo order"
  USERS ||--o{ SHIFTS : "làm ca"
  USERS ||--o{ NOTIFICATIONS : "nhận"
  ZONES ||--o{ TABLES : "chứa"
  TABLES ||--o{ SESSIONS : "có phiên"
  TABLES ||--o{ BOOKINGS : "được đặt"
  SESSIONS ||--o{ ORDERS : "gồm"
  SESSIONS ||--|| INVOICES : "thanh toán"
  ORDERS ||--o{ ORDER_ITEMS : "chi tiết"
  PRODUCTS ||--o{ ORDER_ITEMS : "thuộc"
`;
const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;
document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill','stroke','stroke-width','class','style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
